<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICR - Repass de Casais</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="header">
        <span class="material-icons header-icon">savings</span>
        <h2>Repass de Casais</h2>
        <p class="subtitle">Registre o repass da sua igreja para a ICR Baixada Fluminense</p>
    </div>

    <form id="repassForm">
        <div class="form-group">
            <label for="church">
                <span class="material-icons">church</span> Igreja
            </label>
            <select id="church" required>
                <option value="">Carregando igrejas...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="reference">
                <span class="material-icons">calendar_month</span> Referência
            </label>
            <select id="reference" required>
                <option value="">Carregando referências...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">
                <span class="material-icons">attach_money</span> Valor (R$)
            </label>
            <input
                type="number"
                id="amount"
                required
                min="0.01"
                step="0.01"
                placeholder="0,00"
            >
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="material-icons">done_all</span> Registrar Repass
        </button>
    </form>
</div>

<div id="successArea" class="container success-area hidden">
    <span class="material-icons check-icon">check_circle</span>
    <h3>Repass Registrado!</h3>
    <div class="result-card">
        <p><strong>Igreja:</strong> <span id="resChurch"></span></p>
        <p><strong>Referência:</strong> <span id="resReference"></span></p>
        <p><strong>Valor:</strong> R$ <span id="resAmount"></span></p>
    </div>
    <button class="btn-submit btn-new" id="btnNew">
        <span class="material-icons">add_circle</span> Novo Repass
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
